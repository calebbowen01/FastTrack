name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode
      run: |
        echo "Available Xcode versions:"
        ls -d /Applications/Xcode* || true
        # Select the latest Xcode 26.x available on the runner
        XCODE=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
        if [ -n "$XCODE" ]; then
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "Selected: $XCODE"
        else
          echo "::error::No Xcode 26.x found. .NET 10 iOS SDK requires Xcode 26."
          exit 1
        fi
        xcodebuild -version

    - name: Pin to .NET 10 SDK
      run: |
        cp global.json.ci global.json
        cat global.json

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Verify SDK version
      run: dotnet --version

    - name: Install MAUI Workloads
      run: |
        dotnet workload install maui
        dotnet workload update

    - name: Patch Xcode version check
      run: |
        # The iOS SDK may strictly require a specific Xcode minor version.
        # Downgrade the hard error to a warning so the build can proceed
        # when the runner has a compatible but newer Xcode (e.g. 26.3 vs 26.2).
        find $HOME/.dotnet/packs -name "Xamarin.Shared.Sdk.targets" | while read f; do
          echo "=== Patching: $f ==="
          # Use perl in slurp mode (-0777) to handle <Error ...> elements that
          # span multiple lines before mentioning "requires Xcode".
          perl -0777 -pi -e 's/<Error(\s+(?:(?!<Error|<Warning).)*?requires\s+Xcode)/<Warning$1/gsi' "$f"
          # Verify
          if perl -0777 -ne 'print "found" if /<Warning\s+(?:(?!<Error|<Warning).)*?requires\s+Xcode/si' "$f" | grep -q found; then
            echo "✅ Patch verified for: $f"
          else
            echo "⚠️  Slurp match failed, trying line-range fallback..."
            # Fallback: find the line with "requires Xcode" and patch <Error
            # in a 10-line window above it (handles multi-line XML elements).
            LINE=$(grep -n 'requires Xcode' "$f" | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              START=$((LINE - 10)); [ $START -lt 1 ] && START=1
              sed -i '' "${START},${LINE}s/<Error/<Warning/" "$f"
              echo "✅ Fallback patch applied near line $LINE"
            else
              echo "❌ Could not locate Xcode version check in: $f"
            fi
          fi
        done

    - name: Build iOS IPA
      run: |
        dotnet publish -f net10.0-ios -c Release -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="-" -p:CodesignProvision="" -p:EnableCodeSigning=false

    - name: Find IPA
      run: |
        find . -name "*.ipa" -o -name "*.app" | head -20
        ls -la bin/Release/net10.0-ios/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/publish/ || true

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v5
      with:
        name: FastTrack-iOS
        path: |
          **/*.ipa
          **/publish/*.app
        if-no-files-found: warn
