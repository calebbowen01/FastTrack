name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Diagnose Xcode environment
      run: |
        echo "::group::macOS info"
        sw_vers
        echo "::endgroup::"
        echo "::group::Available Xcode installations"
        ls -d /Applications/Xcode* 2>/dev/null || echo "None found"
        echo "::endgroup::"
        echo "::group::Default Xcode"
        xcode-select -p
        xcodebuild -version 2>/dev/null || true
        echo "::endgroup::"
        echo "::group::Available SDKs"
        xcodebuild -showsdks 2>/dev/null || true
        echo "::endgroup::"

    - name: Select best Xcode
      run: |
        # Prefer Xcode 26.x (for .NET 10 / iOS 26 SDK), then fall back
        XCODE=""
        for pattern in "/Applications/Xcode_26*.app" "/Applications/Xcode_16*.app" "/Applications/Xcode.app"; do
          MATCH=$(ls -d $pattern 2>/dev/null | sort -V | tail -1)
          if [ -n "$MATCH" ] && [ -d "$MATCH/Contents/Developer" ]; then
            XCODE="$MATCH"
            break
          fi
        done

        if [ -z "$XCODE" ]; then
          echo "::error::No usable Xcode found"
          exit 1
        fi

        echo "Selected: $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        sudo xcodebuild -license accept 2>/dev/null || true
        sudo xcodebuild -runFirstLaunch 2>/dev/null || true
        xcodebuild -version
        echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo 'NOT FOUND')"
        echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-path 2>/dev/null || echo 'NOT FOUND')"

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Configure SDK
      run: |
        cp global.json.ci global.json
        echo "--- .NET SDK ---"
        dotnet --version
        dotnet --list-sdks
        echo "--- MAUI workload ---"
        dotnet workload install maui
        dotnet workload list

    - name: Restore packages
      run: |
        dotnet restore /p:TargetFramework=net10.0-ios 2>&1 | tee restore.log
        echo "Restore exit code: $?"

    - name: Build iOS
      run: |
        set -o pipefail
        dotnet publish \
          -f net10.0-ios \
          -c Release \
          -p:ArchiveOnBuild=true \
          -p:RuntimeIdentifier=ios-arm64 \
          -p:CodesignKey="-" \
          -p:_RequireCodeSigning=false \
          --verbosity detailed 2>&1 | tee build.log

    - name: Locate build output
      if: always()
      run: |
        echo "=== EVERYTHING under bin/ ==="
        find ./bin -type f 2>/dev/null | sort
        echo ""
        echo "=== All directories under bin/ ==="
        find ./bin -type d 2>/dev/null | sort
        echo ""
        echo "=== .app bundles (directories) ==="
        find . -name "*.app" -type d 2>/dev/null
        echo ""
        echo "=== .ipa files anywhere ==="
        find . -name "*.ipa" 2>/dev/null

    - name: Package IPA for sideloading
      if: success()
      run: |
        # Search everywhere, not just bin/
        APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | grep -v node_modules | head -1)
        IPA_PATH=$(find . -name "*.ipa" 2>/dev/null | head -1)

        mkdir -p output

        # If dotnet already produced an IPA, just use it
        if [ -n "$IPA_PATH" ]; then
          echo "✅ Found IPA directly: $IPA_PATH"
          cp "$IPA_PATH" output/FastTrack.ipa
        elif [ -n "$APP_PATH" ]; then
          echo "✅ Found .app bundle: $APP_PATH"

          # Create IPA from .app
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r output/FastTrack.ipa Payload
          rm -rf Payload

          # Also copy the raw .app
          mkdir -p output/app
          cp -R "$APP_PATH" output/app/
        else
          echo "::warning::No .app or .ipa found — uploading raw build output instead"
          # Copy whatever was built so we can inspect it
          cp -R bin/ output/bin/ 2>/dev/null || true
        fi

        echo "=== Output contents ==="
        find output/ -type f 2>/dev/null | head -30
        du -sh output/ 2>/dev/null || true

    - name: Upload IPA (for sideloading)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: FastTrack-IPA
        path: output/FastTrack.ipa
        if-no-files-found: warn

    - name: Upload App Bundle (raw .app)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: FastTrack-App
        path: output/app/
        if-no-files-found: warn

    - name: Upload raw build output (debug)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-output-debug
        path: bin/Release/
        if-no-files-found: warn

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: "*.log"
