name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode
      run: |
        echo "Available Xcode versions:"
        ls -d /Applications/Xcode* || true
        # Prefer Xcode 26.2 (matches .NET 10 iOS SDK), fall back to lowest 26.x
        XCODE=$(ls -d /Applications/Xcode_26.2* 2>/dev/null | head -1)
        if [ -z "$XCODE" ]; then
          XCODE=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | head -1)
        fi
        if [ -n "$XCODE" ]; then
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "Selected: $XCODE"
        else
          echo "::error::No Xcode 26.x found. .NET 10 iOS SDK requires Xcode 26."
          exit 1
        fi
        xcodebuild -version

    - name: Pin to .NET 10 SDK
      run: |
        cp global.json.ci global.json
        cat global.json

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Verify SDK version
      run: dotnet --version

    - name: Install MAUI Workloads
      run: |
        dotnet workload install maui
        dotnet workload update

    - name: Build iOS IPA
      run: |
        dotnet publish -f net10.0-ios -c Release -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="-" -p:CodesignProvision="" -p:EnableCodeSigning=false

    - name: Find IPA
      run: |
        find . -name "*.ipa" -o -name "*.app" | head -20
        ls -la bin/Release/net10.0-ios/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/publish/ || true

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v5
      with:
        name: FastTrack-iOS
        path: |
          **/*.ipa
          **/publish/*.app
        if-no-files-found: warn
