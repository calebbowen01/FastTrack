name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode
      run: |
        echo "Available Xcode versions:"
        ls -d /Applications/Xcode* 2>/dev/null || true
        # Find a working Xcode 26.x (newest first) by checking the MacOSX SDK exists
        SELECTED=""
        for XCODE in $(ls -d /Applications/Xcode_26* 2>/dev/null | sort -Vr); do
          SDK="$XCODE/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          if [ -d "$SDK" ] && ls "$SDK"/MacOSX*.sdk 1>/dev/null 2>&1; then
            SELECTED="$XCODE"
            echo "✓ $XCODE has MacOSX SDK"
            break
          else
            echo "✗ $XCODE missing MacOSX SDK, skipping"
          fi
        done
        if [ -z "$SELECTED" ]; then
          # Fallback: try default Xcode
          echo "No Xcode 26.x with MacOSX SDK found. Trying default Xcode..."
          SELECTED=$(xcode-select -p 2>/dev/null | sed 's|/Contents/Developer||')
          if [ ! -d "$SELECTED" ]; then
            echo "::error::No working Xcode installation found."
            ls -la /Applications/Xcode*/Contents/Developer/Platforms/ 2>/dev/null || true
            exit 1
          fi
        fi
        sudo xcode-select -s "$SELECTED/Contents/Developer"
        echo "Selected: $SELECTED"
        xcodebuild -version
        echo "Available SDKs:"
        xcodebuild -showsdks 2>/dev/null | head -20 || true

    - name: Pin to .NET 10 SDK
      run: |
        cp global.json.ci global.json
        cat global.json

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Verify SDK version
      run: dotnet --version

    - name: Install MAUI Workloads
      run: |
        dotnet workload install maui
        dotnet workload update

    - name: Build iOS IPA
      run: |
        dotnet publish -f net10.0-ios -c Release -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="-" -p:CodesignProvision="" -p:EnableCodeSigning=false -p:ValidateXcodeVersion=false

    - name: Find IPA
      run: |
        find . -name "*.ipa" -o -name "*.app" | head -20
        ls -la bin/Release/net10.0-ios/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/publish/ || true

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v5
      with:
        name: FastTrack-iOS
        path: |
          **/*.ipa
          **/publish/*.app
        if-no-files-found: warn
