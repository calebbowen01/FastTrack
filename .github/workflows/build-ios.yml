name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5

    - name: Pin to .NET 10 SDK
      run: |
        cp global.json.ci global.json
        cat global.json

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Verify SDK version
      run: dotnet --version

    - name: Install MAUI Workloads
      run: dotnet workload install maui

    - name: Build iOS IPA
      run: |
        dotnet publish -f net10.0-ios -c Release -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="-" -p:CodesignProvision="" -p:EnableCodeSigning=false

    - name: Find IPA
      run: |
        find . -name "*.ipa" -o -name "*.app" | head -20
        ls -la bin/Release/net10.0-ios/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/publish/ || true

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v5
      with:
        name: FastTrack-iOS
        path: |
          **/*.ipa
          **/publish/*.app
        if-no-files-found: warn
