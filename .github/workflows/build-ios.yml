name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode
      run: |
        echo "=== Available Xcode installations ==="
        ls -d /Applications/Xcode* 2>/dev/null || true

        # Select the latest Xcode 26.x (.NET 10 iOS SDK requires 26.x)
        XCODE=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
        if [ -z "$XCODE" ]; then
          XCODE=$(ls -d /Applications/Xcode.app 2>/dev/null || echo "")
        fi
        if [ -z "$XCODE" ]; then
          echo "::error::No Xcode installation found"
          exit 1
        fi

        echo "Selected: $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        sudo xcodebuild -license accept 2>/dev/null || true
        sudo xcodebuild -runFirstLaunch 2>/dev/null || true
        xcodebuild -version

        # Diagnose and repair missing platform SDKs
        for PLAT in MacOSX iPhoneOS; do
          SDKS_DIR="$XCODE/Contents/Developer/Platforms/${PLAT}.platform/Developer/SDKs"
          echo "--- $PLAT platform ---"
          ls -la "$SDKS_DIR" 2>/dev/null || echo "  Directory missing: $SDKS_DIR"

          # If there's a versioned SDK but no generic symlink, create it
          if [ -d "$SDKS_DIR" ]; then
            GENERIC="${SDKS_DIR}/${PLAT}.sdk"
            if [ ! -e "$GENERIC" ]; then
              VERSIONED=$(ls -d "$SDKS_DIR"/${PLAT}[0-9]*.sdk 2>/dev/null | sort -V | tail -1)
              if [ -n "$VERSIONED" ]; then
                echo "  Creating symlink: ${PLAT}.sdk -> $(basename $VERSIONED)"
                sudo ln -sf "$(basename $VERSIONED)" "$GENERIC"
              fi
            fi
          fi
        done

        # Download missing platform SDKs if needed
        if ! xcrun --sdk macosx --show-sdk-path 2>/dev/null; then
          echo "macOS SDK not found - downloading platform..."
          xcodebuild -downloadPlatform macOS 2>&1 || true
        fi
        if ! xcrun --sdk iphoneos --show-sdk-path 2>/dev/null; then
          echo "iOS SDK not found - downloading platform..."
          xcodebuild -downloadPlatform iOS 2>&1 || true
        fi

        echo "=== Final SDK verification ==="
        echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-path 2>/dev/null || echo 'NOT FOUND')"
        echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo 'NOT FOUND')"
        xcodebuild -showsdks 2>/dev/null | head -20 || true

    - name: Pin to .NET 10 SDK
      run: |
        cp global.json.ci global.json
        cat global.json

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Verify SDK version
      run: dotnet --version

    - name: Install MAUI Workloads
      run: |
        dotnet workload install maui
        dotnet workload update

    - name: Build iOS IPA
      run: |
        dotnet publish -f net10.0-ios -c Release -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="-" -p:CodesignProvision="" -p:EnableCodeSigning=false -p:ValidateXcodeVersion=false

    - name: Find IPA
      run: |
        find . -name "*.ipa" -o -name "*.app" | head -20
        ls -la bin/Release/net10.0-ios/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/publish/ || true

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v5
      with:
        name: FastTrack-iOS
        path: |
          **/*.ipa
          **/publish/*.app
        if-no-files-found: warn
