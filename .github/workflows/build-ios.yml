name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.203'

    - name: Install MAUI Workload
      run: dotnet workload install maui-ios --skip-manifest-update

    - name: Pin SDK for iOS build
      run: cp global.json.ci global.json

    - name: Build iOS IPA
      run: |
        dotnet publish -f net9.0-ios -c Release -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="-" -p:CodesignProvision="" -p:EnableCodeSigning=false -p:TargetFrameworks=net9.0-ios

    - name: Find IPA
      run: |
        find . -name "*.ipa" -o -name "*.app" | head -20
        ls -la bin/Release/net10.0-ios/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/publish/ || true

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v5
      with:
        name: FastTrack-iOS
        path: |
          **/*.ipa
          **/publish/*.app
        if-no-files-found: warn
