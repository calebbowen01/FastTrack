name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Diagnose Xcode environment
      run: |
        echo "::group::macOS info"
        sw_vers
        echo "::endgroup::"
        echo "::group::Available Xcode installations"
        ls -d /Applications/Xcode* 2>/dev/null || echo "None found"
        echo "::endgroup::"
        echo "::group::Default Xcode"
        xcode-select -p
        xcodebuild -version 2>/dev/null || true
        echo "::endgroup::"
        echo "::group::Available SDKs"
        xcodebuild -showsdks 2>/dev/null || true
        echo "::endgroup::"

    - name: Select best Xcode
      run: |
        # Prefer Xcode 26.x (for .NET 10 / iOS 26 SDK), then fall back
        XCODE=""
        for pattern in "/Applications/Xcode_26*.app" "/Applications/Xcode_16*.app" "/Applications/Xcode.app"; do
          MATCH=$(ls -d $pattern 2>/dev/null | sort -V | tail -1)
          if [ -n "$MATCH" ] && [ -d "$MATCH/Contents/Developer" ]; then
            XCODE="$MATCH"
            break
          fi
        done

        if [ -z "$XCODE" ]; then
          echo "::error::No usable Xcode found"
          exit 1
        fi

        echo "Selected: $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        sudo xcodebuild -license accept 2>/dev/null || true
        sudo xcodebuild -runFirstLaunch 2>/dev/null || true
        xcodebuild -version
        echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo 'NOT FOUND')"
        echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-path 2>/dev/null || echo 'NOT FOUND')"

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Configure SDK
      run: |
        cp global.json.ci global.json
        echo "--- .NET SDK ---"
        dotnet --version
        dotnet --list-sdks
        echo "--- MAUI workload ---"
        dotnet workload install maui
        dotnet workload list

    - name: Restore packages
      run: |
        dotnet restore /p:TargetFramework=net10.0-ios 2>&1 | tee restore.log
        echo "Restore exit code: $?"

    - name: Build iOS
      run: |
        dotnet publish \
          -f net10.0-ios \
          -c Release \
          -p:RuntimeIdentifier=ios-arm64 \
          -p:CodesignKey="-" \
          -p:CodesignProvision="" \
          -p:EnableCodeSigning=false \
          --verbosity detailed 2>&1 | tee build.log

    - name: Locate and package build output
      if: always()
      run: |
        echo "=== Finding all build output ==="
        find . -name "*.ipa" 2>/dev/null | head -20
        find . -name "*.app" -type d 2>/dev/null | head -20
        ls -laR bin/Release/net10.0-ios/ 2>/dev/null | head -80 || echo "No Release output"

        # Create an IPA from the .app bundle if one exists
        APP_PATH=$(find ./bin -name "*.app" -type d 2>/dev/null | head -1)
        if [ -n "$APP_PATH" ]; then
          echo "Found .app bundle: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r FastTrack.ipa Payload
          echo "Created FastTrack.ipa ($(du -h FastTrack.ipa | cut -f1))"
          rm -rf Payload
        else
          echo "::warning::No .app bundle found in build output"
        fi

    - name: Upload iOS artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: FastTrack-iOS
        path: |
          FastTrack.ipa
          bin/Release/net10.0-ios/ios-arm64/publish/
        if-no-files-found: warn

    - name: Upload build logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: "*.log"
