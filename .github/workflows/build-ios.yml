name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode
      run: |
        echo "Available Xcode versions:"
        ls -d /Applications/Xcode* || true
        # Select the latest Xcode 26.x available on the runner
        XCODE=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
        if [ -n "$XCODE" ]; then
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "Selected: $XCODE"
        else
          echo "::error::No Xcode 26.x found. .NET 10 iOS SDK requires Xcode 26."
          exit 1
        fi
        xcodebuild -version

    - name: Pin to .NET 10 SDK
      run: |
        cp global.json.ci global.json
        cat global.json

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Verify SDK version
      run: dotnet --version

    - name: Install MAUI Workloads
      run: |
        dotnet workload install maui
        dotnet workload update

    - name: Patch Xcode version check
      run: |
        # The iOS SDK 26.2 strictly requires Xcode 26.2 but the runner has 26.3.
        # The workload-installed targets files may be read-only, so chmod first.
        FILES=$(find $HOME/.dotnet/packs -name "Xamarin.Shared.Sdk.targets" 2>/dev/null)
        if [ -z "$FILES" ]; then
          echo "⚠️ No Xamarin.Shared.Sdk.targets found — skipping patch"
          exit 0
        fi

        echo "$FILES" | while IFS= read -r f; do
          echo "=== Patching: $f ==="
          chmod u+w "$f"

          # Show context around the Xcode version check
          echo "--- Lines mentioning Xcode (before patch) ---"
          grep -n 'Xcode\|_RequiredXcode' "$f" | head -20

          # Find the line(s) that emit the error text
          ERROR_LINES=$(grep -n 'requires Xcode' "$f" | cut -d: -f1)
          if [ -z "$ERROR_LINES" ]; then
            echo "⚠️  'requires Xcode' not found in $f"
            continue
          fi

          for LINE in $ERROR_LINES; do
            START=$((LINE - 10)); [ $START -lt 1 ] && START=1
            END=$((LINE + 2))
            echo "--- Before (lines $START-$END) ---"
            sed -n "${START},${END}p" "$f"
            # Replace <Error with <Warning (handles both self-closing and paired tags)
            sed -i '' "${START},${END}s/<Error/<Warning/g" "$f"
            sed -i '' "${START},${END}s/<\/Error/<\/Warning/g" "$f"
            echo "--- After ---"
            sed -n "${START},${END}p" "$f"
          done

          # Final verification
          if grep -q '<Error.*requires Xcode\|requires Xcode.*<Error' "$f"; then
            echo "❌ Patch may not have fully applied for: $f"
          else
            echo "✅ Patch verified for: $f"
          fi
        done

    - name: Build iOS IPA
      run: |
        dotnet publish -f net10.0-ios -c Release -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="-" -p:CodesignProvision="" -p:EnableCodeSigning=false

    - name: Find IPA
      run: |
        find . -name "*.ipa" -o -name "*.app" | head -20
        ls -la bin/Release/net10.0-ios/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/ || true
        ls -la bin/Release/net10.0-ios/ios-arm64/publish/ || true

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v5
      with:
        name: FastTrack-iOS
        path: |
          **/*.ipa
          **/publish/*.app
        if-no-files-found: warn
